<svg width="680" viewBox="0 0 680 616" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<title>What each virtual key can reach, now and after adding a cloud provider</title>
<desc>Two grids. Today, private reaches only local roles while lan, lan-cloud and general all reach the same local roles plus cloud-cheap. After a cloud provider key is added, lan-cloud and general widen to the new cloud roles while lan stays on cloud-cheap and private stays local only.</desc>

<text x="40" y="30" font-size="15" font-weight="500" fill="#888780">Today — only `private` is actually different</text>

<text x="168" y="60" font-size="12" fill="#888780">local roles (4)</text>
<text x="320" y="60" font-size="12" fill="#888780">cloud-cheap</text>
<text x="462" y="60" font-size="12" fill="#888780">cloud-code, frontier</text>

<text x="40" y="94" font-size="14" font-weight="500" fill="#888780">private</text>
<rect x="160" y="74" width="140" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="230" y="94" font-size="14" fill="#085041" text-anchor="middle">yes</text>
<rect x="312" y="74" width="130" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="377" y="94" font-size="14" fill="#444441" text-anchor="middle">blocked</text>
<rect x="454" y="74" width="186" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="547" y="94" font-size="14" fill="#444441" text-anchor="middle">blocked</text>

<text x="40" y="140" font-size="14" font-weight="500" fill="#888780">lan</text>
<rect x="160" y="120" width="140" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="230" y="140" font-size="14" fill="#085041" text-anchor="middle">yes</text>
<rect x="312" y="120" width="130" height="32" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="377" y="140" font-size="14" fill="#633806" text-anchor="middle">yes</text>
<rect x="454" y="120" width="186" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="547" y="140" font-size="14" fill="#444441" text-anchor="middle">blocked</text>

<text x="40" y="186" font-size="14" font-weight="500" fill="#888780">lan-cloud</text>
<rect x="160" y="166" width="140" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="230" y="186" font-size="14" fill="#085041" text-anchor="middle">yes</text>
<rect x="312" y="166" width="130" height="32" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="377" y="186" font-size="14" fill="#633806" text-anchor="middle">yes</text>
<rect x="454" y="166" width="186" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="547" y="186" font-size="14" fill="#444441" text-anchor="middle">nothing to reach</text>

<text x="40" y="232" font-size="14" font-weight="500" fill="#888780">general</text>
<rect x="160" y="212" width="140" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="230" y="232" font-size="14" fill="#085041" text-anchor="middle">yes</text>
<rect x="312" y="212" width="130" height="32" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="377" y="232" font-size="14" fill="#633806" text-anchor="middle">yes</text>
<rect x="454" y="212" width="186" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="547" y="232" font-size="14" fill="#444441" text-anchor="middle">nothing to reach</text>

<line x1="40" y1="276" x2="640" y2="276" stroke="#B4B2A9" stroke-width="0.5"/>

<text x="40" y="326" font-size="15" font-weight="500" fill="#888780">After you add an OpenRouter or Anthropic key</text>

<text x="168" y="356" font-size="12" fill="#888780">local roles (4)</text>
<text x="320" y="356" font-size="12" fill="#888780">cloud-cheap</text>
<text x="462" y="356" font-size="12" fill="#888780">cloud-code, frontier</text>

<text x="40" y="390" font-size="14" font-weight="500" fill="#888780">private</text>
<rect x="160" y="370" width="140" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="230" y="390" font-size="14" fill="#085041" text-anchor="middle">yes</text>
<rect x="312" y="370" width="130" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="377" y="390" font-size="14" fill="#444441" text-anchor="middle">blocked</text>
<rect x="454" y="370" width="186" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="547" y="390" font-size="14" fill="#444441" text-anchor="middle">blocked</text>

<text x="40" y="436" font-size="14" font-weight="500" fill="#888780">lan</text>
<rect x="160" y="416" width="140" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="230" y="436" font-size="14" fill="#085041" text-anchor="middle">yes</text>
<rect x="312" y="416" width="130" height="32" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="377" y="436" font-size="14" fill="#633806" text-anchor="middle">yes</text>
<rect x="454" y="416" width="186" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="547" y="436" font-size="14" fill="#444441" text-anchor="middle">blocked</text>

<text x="40" y="482" font-size="14" font-weight="500" fill="#888780">lan-cloud</text>
<rect x="160" y="462" width="140" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="230" y="482" font-size="14" fill="#085041" text-anchor="middle">yes</text>
<rect x="312" y="462" width="130" height="32" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="377" y="482" font-size="14" fill="#633806" text-anchor="middle">yes</text>
<rect x="454" y="462" width="186" height="32" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="547" y="482" font-size="14" fill="#633806" text-anchor="middle">yes — now it differs</text>

<text x="40" y="528" font-size="14" font-weight="500" fill="#888780">general</text>
<rect x="160" y="508" width="140" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="230" y="528" font-size="14" fill="#085041" text-anchor="middle">yes</text>
<rect x="312" y="508" width="130" height="32" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="377" y="528" font-size="14" fill="#633806" text-anchor="middle">yes</text>
<rect x="454" y="508" width="186" height="32" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="547" y="528" font-size="14" fill="#633806" text-anchor="middle">yes</text>

<rect x="40" y="566" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="62" y="578" font-size="12" fill="#888780">local, private</text>
<rect x="164" y="566" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="186" y="578" font-size="12" fill="#888780">cloud, leaves the machine</text>
<rect x="374" y="566" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="396" y="578" font-size="12" fill="#888780">refused by the gateway</text>
</svg>
